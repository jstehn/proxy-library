# The same gate as `pnpm check` on a developer's machine, plus the integration tests.
# Nothing here uses secrets, and nothing deploys.
name: check

on:
  push:
    branches: [main, refactor/main]
  pull_request:
    branches: [main, refactor/main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (typecheck, lint, cycles, format, unit tests, sizes, clones, knip)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No `version:` here: pnpm/action-setup reads "packageManager" from package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  integration:
    name: integration tests (Postgres 17 + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Optional for now: make it required once it has passed three times in a row.
    continue-on-error: true
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: tcg
          POSTGRES_PASSWORD: tcg
          POSTGRES_DB: tcg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tcg -d tcg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The test setup refuses a database whose name doesn't contain "_test".
      TEST_DATABASE_URL: postgres://tcg:tcg@localhost:5432/tcg_test
      DATABASE_URL: postgres://tcg:tcg@localhost:5432/tcg_test
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int
        # `runner` isn't available in a job's env, only in its steps.
        env:
          IMAGE_CACHE_DIR: ${{ runner.temp }}/images
          SYNC_CACHE_DIR: ${{ runner.temp }}/cache

  # Follow-up: an end-to-end job (`pnpm test:e2e`). Playwright needs browsers installed first.
