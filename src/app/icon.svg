<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="cardFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#141417" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Back card -->
  <g transform="translate(256 256) rotate(-13)">
    <rect x="-104" y="-142" width="208" height="284" rx="20" fill="#18181b" stroke="#52525b" stroke-width="10" />
  </g>

  <!-- Front card -->
  <g transform="translate(274 260) rotate(5)">
    <rect x="-104" y="-142" width="208" height="284" rx="20" fill="url(#cardFront)" stroke="url(#gold)" stroke-width="12" />
    <rect x="-78" y="-114" width="156" height="122" rx="10" fill="#09090b" stroke="#3f3f46" stroke-width="4" />
    <!-- Four-pointed spark / mana diamond -->
    <path d="M0 -92 L18 -58 L52 -40 L18 -22 L0 12 L-18 -22 L-52 -40 L-18 -58 Z" fill="url(#gold)" />
    <!-- Text lines at bottom of card -->
    <rect x="-72" y="34" width="144" height="14" rx="7" fill="#a1a1aa" />
    <rect x="-72" y="64" width="104" height="12" rx="6" fill="#52525b" />
    <rect x="-72" y="90" width="124" height="12" rx="6" fill="#52525b" />
  </g>
</svg>
