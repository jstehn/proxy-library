me>\n\u003C\u002Fdiv>\n\n\u003Cp>\u003Cstrong>More about \u003Cem>Secrets of\nStrixhaven\u003C\u002Fem>\u003C\u002Fstrong>\u003C\u002Fp>\n\u003Cp>Return to Strixhaven, \u003Cem>Magic\u003C\u002Fem>'s beloved mage school,\nand uncover years of mysteries as you explore its hallowed halls and\nbeyond. The five colleges are back, each with their own unique look,\nfeel, and magic focus. As you increase your skills, make academic\ndiscoveries and work to prove your college is the best, but\nbeware—second-year knowledge comes with a side of increased\ndanger.\u003C\u002Fp>","\u003Cul>\n\n\u003Cli>Includes 5 \u003Ci>Secrets of Strixhaven\u003C\u002Fi> Play Boosters\n\u003Cul>\n\u003Cli>Each Play Booster contains 14 \u003Ci>Magic: The Gathering\u003C\u002Fi> cards\n\u003Cul>\n\u003Cli>May contain these cards: SOS 1–305; SOA 1–65; SPG 149–158\u003C\u002Fli>\n\u003Cli>1–5 cards of rarity Rare or higher (2: 33%; 3: 6%; 4–5: \u003C1%)\u003C\u002Fli>\n\u003Cli>3–6 Uncommon cards\u003C\u002Fli>\n\u003Cli>5–8 Common cards\u003C\u002Fli>\n\u003Cli>1 Land cards\u003C\u002Fli>\n\u003Cli>1 card of any rarity is Traditional Foil\u003C\u002Fli>\n\u003Cli>Foil Borderless Mythic in \u003C1% of boosters\u003C\u002Fli>\n\u003Cli>Traditional Foil Land replaces a Land in 20% of boosters\u003C\u002Fli>\n\u003C\u002Ful>\n\u003C\u002Fli>\n\u003C\u002Ful>\n\u003C\u002Fli>\n\u003Cli>1 \u003Ci>Secrets of Strixhaven\u003C\u002Fi> Seeded Booster\n\u003Cul>\n\u003Cli>Each Seeded Booster is themed around a different Strixhaven college\u003C\u002Fli>\n\u003Cli>14 college-aligned cards including 1 Traditional Foil Rare or Mythic Rare\u003C\u002Fli>\n\u003C\u002Ful>\n\u003C\u002Fli>\n\u003Cli>1 Traditional Foil Rare\u002FMythic Rare card\u003C\u002Fli>\n\u003Cli>Oversized Spindown™ life counter\u003C\u002Fli>\n\u003C\u002Ful>","15 per carton","2.520\" x 4.291\" x 4.606\" (64 x 109 x 117mm)","0.500 lb (0.227 kg)",[2499,2500,2501,2502,2503,2504],"English","French","German","Italian","Spanish","Japanese","195 agic\u003C\u002Fem>'s most popular multiplayer format\nwith five ready-to-play, 100-card decks, each with a unique two-color\nplay style. Choose your college of magical study and expand your\neducation in the greater world of Arcavios. Every \u003Cem>Secrets of\nStrixhaven\u003C\u002Fem> Commander Deck includes two traditional foil mythic rare\nlegendary creature cards featuring borderless art that can be played as\nyour commander, and each deck introduces 12 never-before-seen Commander\ncards to \u003Cem>Magic: The Gathering\u003C\u002Fem>.\u003C\u002Fp>\n\n\u003Cdiv style=\"text-align: center; margin: 20px 0 20px 0;\">\n\u003Ciframe width=\"560\" height=\"315\" src=\"https:\u002F\u002Fwww.youtube.com\u002Fembed\u002FJ_dh-T0BcOg?si=LdERCGoOIZUZosDz\" title=\"YouTube video player\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen>\u003C\u002Fiframe>\n\u003C\u002Fdiv>\n\n\u003Cp>\u003Cstrong>Silverquill Influence\u003C\u002Fstrong>\u003C\u002Fp>\n\u003Cp>Weaponize your words with Silverquill standout Killian, who\nencourages the rest of the table to attack targets that aren't you. Tap,\ngoad, and control creatures with every enchantment you cast while you\nsit back, draw cards, and savor the mayhem.\u003C\u002Fp>\n\u003Cp>\u003Cstrong>Prismari Artistry\u003C\u002Fstrong>\u003C\u002Fp>\n\u003Cp>Let your creativity run wild with Rootha as your\nartist-in-residence and cast expensive, bombastic spells. Bigger spells\nlet you generate bigger Elementals poised to attack, so pull out all the\nstops and go for broke!\u003C\u002Fp>\n\u003Cp>\u003Cstrong>Witherbloom Pestilence\u003C\u002Fstrong>\u003C\u002Fp>\n\u003Cp>There's trouble brewing when Dina leads your Witherbloom\nforces, so prepare the Pests for sacrifice! Sacrifices grant life,\ncards, and stackable counters that prepare your next victim for gainful\nharvesting or pump your attackers for a deadly push.\u003C\u002Fp>\n\u003Cp>\u003Cstrong>Lorehold Spirit\u003C\u002Fstrong>\u003C\u002Fp>\n\u003Cp>Set out on a Lorehold expedition with Quintorius and\nplaneswalk a lethal path across the table. Create Spirits when cards\nleave your graveyard, then pile on typal Spirit bonuses and buffs to\nbury your opponents six feet deep!\u003C\u002Fp>\n\u003Cp>\u003Cstrong>Quandrix Unlimited\u003C\u002Fstrong>\u003C\u002Fp>\n\u003Cp>In Quandrix, when solving for X, the solution is\nclear—bigger is better! Calculate victory with Zimone using\nFractals, Hydras, and other variable creatures to swarm the battlefield\nwith powers so profound your opponents will be absolutely\nperplexed.\u003C\u002Fp>","\u003Cul>\n\n\u003Cli>1 ready-to-play deck of 100 \u003Ci>Magic\u003C\u002Fi> cards\n\u003Cul>\n\u003Cli>12 new-to-\u003Ci>Magic\u003C\u002Fi> cards, including 2 traditional foil cards\u003C\u002Fli>\n\u003Cli>10 double-sided token cards\u003C\u002Fli>\n\u003Cli>Deck box\u003C\u002Fli>\n\u003Cli>Strategy insert\u003C\u002Fli>\n\u003Cli>Reference card\u003C\u002Fli>\n\u003C\u002Ful>\n\u003C\u002Fli>\n\u003C\u002Ful>","5 per carton","2.520\" x 4.449\" x 6.890\" (64 x 113 x 175mm)","0.670 lb (0.304 kg)",[2499,2500,2501,2502,2503,2504],"195166318035","D53390000","$49.99",{"metadata":2861,"sys":2864,"fields":2875},{"tags":2862,"concepts":2863},[],[],{"space":2865,"id":2867,"type":211,"createdAt":2868,"updatedAt":2869,"environment":2870,"publishedVersion":2872,"revision":281,"contentType":2873,"locale":224},{"sys":2866},{"type":207,"linkType":208,"id":209},"51XuketLFXkrRLh9XPLekp","2026-01-27T18:03:50.190Z","2026-03-31T20:06:08.324Z",{"sys":2871},{"id":216,"type":207,"linkType":217},43,{"sys":2874},{"type":207,"linkType":222,"id":2384},{"entryTitle":2876,"name":2313,"releaseDate":2524,"images":2877,"type":2297,"copy":2900,"packageContents":2901,"caseConfiguration":2902,"dimensions":2903,"weight":2904,"languages":2905,"upc":2906,"sku":2907,"msrp":2908},"Product |
