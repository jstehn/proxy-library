 a chocobo-themed Click Wheel life counter\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>SPECIAL CHOCOBO BOOSTER—Open a Chocobo Booster containing 10 Full-Art Chocobo Basic Lands and 2 of 20 Borderless Chocobo Bundle card of rarity Rare or higher\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>ALT-ART CARD & SCENE CARD—Includes 1 promo card featuring exclusive alternate art and 1 of 24 Borderless Scene Cards; collect each card in a scene and piece them together to reveal iconic moments from beloved FINAL FANTASY games\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>EXCLUSIVE CLICK-WHEEL & CARD BOX—Track your life total with a Chocobo-themed Click Wheel and nest away all your goodies in a special Chocobo Edition card box\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>32 FINAL FANTASY LANDMARK LANDS—Build decks with Full-Art Land featuring 16 different landscapes, 1 for each of the mainline FINAL FANTASY games; this bundle includes both a Traditional Foil and regular version of each\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>10 BOOSTERS FOR PLAYING WITH FRIENDS—Play Boosters are the best way to discover what \u003Ci>Magic\u003C\u002Fi> has to offer; they're perfect for building decks, playing Limited games with friends, and are tons of fun to open\u003C\u002Fp>\u003C\u002Fli> \u003C\u002Ful> \u003Cul> \u003Cli>\u003Cp>CHOCOBO BUNDLE CONTENTS—Ten 14-card Play Boosters, a 12-card Chocobo Booster, 1 alt-art Traditional Foil promo card, 1 of 24 Scene Cards, 32 Basic Lands (16 Traditional Foil, 16 regular), a special Click Wheel life counter, and a Chocobo Edition card box\u003C\u002Fp>\u003C\u002Fli> \u003C\u002Ful>","6 bundles per carton","3.504\" x 7.52\" x 5.394\" (89 x 191 x 137mm)","1.367 lb (0.620 kg)",[2250,2251],"English","Japanese","195166271224","EN: D38560000","$109.99",{"metadata":2256,"sys":2259,"fields":2269},{"tags":2257,"concepts":2258},[],[],{"space":2260,"id":2262,"type":211,"createdAt":2263,"updatedAt":2264,"environment":2265,"publishedVersion":845,"revis rine"," Scene Box – Garland at the Chaos Shrine","\u003Cp>This \u003Cem>Magic: The Gathering\u003C\u002Fem>—FINAL FANTASY Scene Box, Garland at the Chaos Shrine, contains 6 traditional foil borderless scene cards, 6 art-only scene cards, 3 Play Boosters, and a paper display easel. Each Play Booster contains 14 \u003Cem>Magic: The Gathering\u003C\u002Fem> cards, including 1–4 cards of rarity rare or higher, 3–6 uncommon cards, 6–9 common cards, and 1 land card. One card of any rarity is traditional foil. The land card is also traditional foil in 20% of Play Boosters. This product does not contain a Golden Chocobo card (available in English-language Collector Boosters only).\u003C\u002Fp> \u003Cp>© SQUARE ENIX\u003C\u002Fp>","\u003Cul> \u003Cli>\u003Cp>LEGENDARY SCENES COME TO LIFE—Immortalize iconic moments from your favorite games with \u003Cem>Magic: The Gathering\u003C\u002Fem>—FINAL FANTASY Scene Boxes.\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>GARLAND AT THE CHAOS SHRINE—In a world shrouded in darkness, reclaim the light of the Crystals! Rush to the Chaos Shrine to battle Garland, the kidnapper of Princess Sarah.\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>COMBINE 6 BORDERLESS CARDS TO MAKE THIS SCENE—Power up your deck or collection with 6 traditional foil borderless scene cards and piece them together to reveal this iconic moment from the first FINAL FANTASY game.\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>PUT YOUR ART ON FULL DISPLAY—While each scene card is a playable \u003Cem>Magic\u003C\u002Fem> card (including game text), this box also contains 6 art-only cards, allowing you to appreciate the scene in all its glory on the included display easel.\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>INCLUDES 3 PLAY BOOSTERS—Each scene box also comes with 3 Play Boosters; the best way to discover what \u003Cem>Magic\u003C\u002Fem> has to offer, they're perfect for building decks, playing games with friends, and are tons of fun to open.\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>SCENE BOX CONTENTS—6 traditional foil borderless scene cards, 6 art-only scene cards, 3 Play Boosters, and a paper display easel.\u003C\u002Fp>\u003C\u002Fli> \u003C\u002Ful>","4 boxes per carton (1 of each version)","2.008\" x 9.685\" x 8.701\" (51 x 246 x 221mm)","0.701 lb (0.318 kg)",[2250,2251],"195166271194","D38550000","$41.99",{"metadata":2321,"sys":2324,"fields":2334},{"tags":2322,"concepts":2323},[],[],{"space":2325,"id":2327,"type":211,"createdAt":2328,"updatedAt":2329,"environment":2330,"publishedVersion":1147,"revision":240,"contentType":2332,"locale":224},{"sys":2326},{"type":207,"linkType":208,"id":209},"17u4J6Mrmqx3ylE2Vjpiii","2025-09-29T22:55:21.796Z","2025-11-07T20:00:51.575Z",{"sys":2331},{"id":216,"type":207,"linkType":217},{"sys":2333},{"type":207,"linkType":222,"id":2199},{"entryTitle":2335,"name":2336,"releaseDate":2203,"images":2337,"type":2358,"copy":2375,"packageContents":2376,"caseConfiguration":2313,"dimensions":2314,"weight":2315,"languages":2377,"upc":2317,"sku":2318,"msrp":2319},"Product | MTG | Magic: The Gathering®—FINAL FANTASY™ Scene Box – Children of Fate","Magic: The Gathering®—FINAL FANTASY™ Scene Box – Children of Fate",[2338],{"metadata":2339,"sys":2342,"fields":2350},{"tags":2340,"concepts":2341},[],[],{"space":2343,"id":2345,"type":860,"createdAt":2346,"updatedAt":2347,"environment":2348,"publishedVersion":338,"revision":910,"locale":224},{"sys":2344},{"type":207,"linkType":208,"id":209},"5BTsX8jBUQb9Jp0oK8KbDB","2025-09-29T22:55:21.654Z","2025-11-07T20:00:50.505Z",{"sys":2349},{"id":216,"type":207,"linkType":217},{"title":2351,"file":2352},"MTGFIN EN OtrBx Scene 02 01",{"url":2353,"details":2354,"fileName":2357,"contentType":876},"\u002F\u002Fimages.ctfassets.net\u002F0piqveu8x9oj\u002F5BTsX8jBUQb9Jp0oK8KbDB\u002Fbe18b96ef145eae30e65d712eb48e462\u002FMTGFIN_EN_OtrBx_Scene_02_01.png",{"size":2355,"image":2356},168785,{"width":2224,"height":2292},"MTGFIN_EN_OtrBx_Scene_02_01.png",{"metadata":2359,"sy  unfold.\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>COMBINE 6 BORDERLESS CARDS TO MAKE THIS SCENE—Power up your deck or collection with 6 traditional foil borderless Scene card and piece them together to reveal this iconic moment from FINAL FANTASY IX\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>PUT YOUR ART ON FULL DISPLAY—While each scene card is a playable \u003Ci>Magic\u003C\u002Fi> card (including game text), this box also contains 6 art-only cards, allowing you to appreciate the scene in all its glory on the included display easel\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>INCLUDES 3 PLAY BOOSTERS—Each Scene Box also comes with 3 Play Boosters; the best way to discover what \u003Ci>Magic\u003C\u002Fi> has to offer, they're perfect for building decks, playing games with friends, and are tons of fun to open\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>SCENE BOX CONTENTS—6 traditional foil borderless scene cards, 6 Art-Only scene cards, 3 Play Boosters, and a paper display easel\u003C\u002Fp>\u003C\u002Fli> \u003C\u002Ful>",[2250,2251],{"metadata":2438,"sys":2441,"fields":2452},{"tags":2439,"concepts":2440},[],[],{"space":2442,"id":2444,"type":211,"createdAt":2445,"updatedAt":2446,"environment":2447,"publishedVersion":2449,"revision":240,"contentType":2450,"locale":224},{"sys":2443},{"type":207,"linkType":208,"id":209},"2Zr82kiLTTzEgeWMwFfydn","2025-09-29T22:55:21.858Z","2025-11-07T20:00:51.646Z",{"sys":2448},{"id":216,"type":207,"linkType":217},41,{"sys":2451},{"type":207,"linkType":222,"id":2199},{"entryTitle":2453,"name":2454,"releaseDate":2203,"images":2455,"type":2476,"copy":2493,"packageContents":2494,"caseConfiguration":2313,"dimensions":2314,"weight":2315,"languages":2495,"upc":2317,"sku":2318,"msrp":2319},"Product | MTG | Magic: The Gathering®—FINAL FANTASY™ Scene Box – Camp Comrades","Magic: The Gathering®—FINAL FANTASY™ Scene Box – Camp Comrades",[2456],{"metadata":2457,"sys":2460,"fields":2468},{"tags":2458,"concepts":2459},[],[],{"space":2461 Y™ VII Commander Deck – Game Edition","Magic: The Gathering® FINAL FANTASY™ VII Commander Deck – Game Edition",[2515],{"metadata":2516,"sys":2519,"fields":2527},{"tags":2517,"concepts":2518},[],[],{"space":2520,"id":2522,"type":860,"createdAt":2523,"updatedAt":2524,"environment":2525,"publishedVersion":260,"revision":910,"locale":224},{"sys":2521},{"type":207,"linkType":208,"id":209},"4OhwlapNhFnACtiJaaol3M","2025-09-29T22:55:21.703Z","2025-11-07T20:00:50.523Z",{"sys":2526},{"id":216,"type":207,"linkType":217},{"title":2528,"file":2529},"MTGFIN EN OtrBx HldyCmndr 01 01",{"url":2530,"details":2531,"fileName":2535,"contentType":876},"\u002F\u002Fimages.ctfassets.net\u002F0piqveu8x9oj\u002F4OhwlapNhFnACtiJaaol3M\u002F438f6b46e67082d6b2e96ca7ad0927b2\u002FMTGFIN_EN_OtrBx_HldyCmndr_01_01.png",{"size":2532,"image":2533},162340,{"width":2224,"height":2534},310,"MTGFIN_EN_OtrBx_HldyCmndr_01_01.png",{"metadata":2537,"sys":2540,"fields":2550},{"tags":2538,"concepts":2539},[],[],{"space":2541,"id":2543,"type":211,"createdAt":2544,"updatedAt":2545,"environment":2546,"publishedVersion":338,"revision":910,"contentType":2548,"locale":224},{"sys":2542},{"type":207,"linkType":208,"id":209},"7MJzBOW0Etcz7CPeOneihs","2025-09-29T22:55:21.905Z","2025-11-07T20:00:51.709Z",{"sys":2547},{"id":216,"type":207,"linkType":217},{"sys":2549},{"type":207,"linkType":222,"id":2178},{"entryTitle":2551,"label":2552,"value":2553},"Product Type | Commander Deck – Game Edition","FINAL FANTASY™ VII Commander Deck – Game Edition","product-type-or-commander-deck-game-edition","\u003Cp>FINAL FANTASY VII reshaped the RPG landscape, and now its unforgettable characters and exciting moments burst onto the \u003Cem>Magic\u003C\u002Fem> battlefield and back onto PCs with this special release of \u003Cem>Magic: The Gathering®\u003C\u002Fem> FINAL FANTASY VII Commander Deck – Game Edition.\u003C\u002Fp> \u003Cp>In this edition, players get a deck mechanically identical to the original \u003Cem>Magic: The Gathering\u003C\u002Fem>—FINAL FANTASY Limit Break Commander deck released in June and a brand-new traditional foil promo card: Cloud, Midgar Mercenary. Plus, they also get one code redeemable for a digital download of the original FINAL FANTASY VII video game for the PC.\u003C\u002Fp> \u003Cp>In Commander, four players come together to show their strength and strategy, with one player coming out on top. This 100-card ready-to-play \u003Cem>Magic: The Gathering\u003C\u002Fem>—FINAL FANTASY Commander Deck makes it easy for Commander fans in your store to start playing right away.\u003C\u002Fp> \u003Cp>© SQUARE ENIX\u003C\u002Fp>","\u003Cul> \u003Cli>\u003Cp>1 ready-to-play deck of 100 \u003Cem>Magic \u003C\u002Fem>cards (2 traditional foil legendary cards, 98 non-foil cards)\u003C\u002Fp> \u003Cul> \u003Cli>\u003Cp>25 new-to-\u003Cem>Magic\u003C\u002Fem> cards in each deck (mechanically identical to original June release) \u003C\u002Fp>\u003C\u002Fli> \u003C\u002Ful>\u003C\u002Fli> \u003Cli>\u003Cp>2-card Collector Booster Sample Pack\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>10 double-sided tokens\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>1 deck box (can hold 100 sleeved cards)\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>1 strategy insert\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>1 reference card\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>1 traditional foil Cloud, Midgar Mercenary promo card\u003C\u002Fp>\u003C\u002Fli> \u003Cli>\u003Cp>1 code to redeem for FINAL FANTASY VII digital download for PC\u003C\u002Fp>\u003C\u002Fli> \u003C\u002Ful>","4 decks per carton","3.268\" x 5.394\" x 7.638\" (83 x 137 x 194mm)","0.869 lb (0.394 kg)",[2250],"195166315331","D55290000","$99.99",{"metadata":2564,"sys":2567,"fields":2577},{"tags":2565,"concepts":2566},[],[],{"space":2568,"id":2570,"type":211,"createdAt":2571,"updatedAt":2572,"environment":2573,"publishedVersion":1816,"revision":910,"contentType":2575,"locale":224},{"sys":2569},{"type":207,"linkType":208,"id":209 elease-pack","\u003Cp>The entire FINAL FANTASY saga is here! Your players will step into the worlds of the beloved FINAL FANTASY RPG series' sixteen mainline games. They'll cast powerful spells, call upon classic summons, and even visit their favorite locations on the back of a Chocobo. Countless elements from the games are here for players to weave together their own stories.\u003C\u002Fp> \r\n\r\n\u003Cp>Prerelease is the grandest celebration of a set; it's your community’s first opportunity to get their hands on the newest Magic: The Gathering release. Prerelease Packs are the perfect product to fuel the first events of a new set release, allowing players to explore what the set has to offer and giving them everything they need to make their first deck.\u003C\u002Fp> \r\n\r\n\u003Ch2>About FINAL FANTASY\u003C\u002Fh2> \r\n\r\n\u003Cp>Since the release of its first title in 1987, the FINAL FANTASY series has become a global phenomenon due to its cutting edge graphics technology, unique and distinctive world settings, and rich storylines. It has since sold over 195,000,000 copies (package\u002Fdownloads).\u003C\u002Fp> ","\u003Cul> \n\n\u003Cli>6 \u003Cem>Magic: The Gathering—\u003C\u002Fem>FINAL FANTASY Play Boosters\u003C\u002Fli> \n\n\u003Cli>1 foil, year-stamped Rare or Mythic Rare\u003C\u002Fli> \n\n\u003Cli>1 deck box\u003C\u002Fli> \n\n\u003Cli>1 Spindown die\u003C\u002Fli> \n\n\u003Cli>Each Play Booster contains:\u003C\u002Fli> \n\n\u003Cul>\n  \u003Cli>14 \u003Cem>Magic: The Gathering\u003C\u002Fem> cards\u003C\u002Fli> \n\n\u003Cli>1-4 cards of rarity Rare of higher\u003C\u002Fli> \n\n\u003Cli>3-6 Uncommon cards\u003C\u002Fli> \n\n\u003Cli>6-9 Common cards\u003C\u002Fli> \n\n\u003Cli>1 Land card (Traditional Foil Land replaces a Land in 20% of boosters)\u003C\u002Fli> \n\n\u003Cli>1 card of any rarity is Traditional Foil; Foil Borderless Mythic Rare in 1% of boosters\u003C\u002Fli> \n\n\u003C\u002Ful>\n\u003C\u002Ful> ","15 packs per carton","2.047\" x 2.
